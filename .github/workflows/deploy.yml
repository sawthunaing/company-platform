# A merge to main: run every test (ci.yml), build the images, deploy them to the server.
# A failing test stops the run before any image is built, so nothing is deployed.
#
# Settings (GitHub → Settings → Secrets and variables → Actions):
#   variables  DOMAIN              e.g. company.com (images are built for www/admin/api.<DOMAIN>)
#              DEPLOY_ENABLED      "true" once the server is ready; until then images are built but not deployed
#   secrets    DEPLOY_HOST         server address
#              DEPLOY_USER         SSH user in the docker group
#              DEPLOY_SSH_KEY      private key for that user (a key made only for deploys)
#              DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan <server>
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in merge order; never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    if: vars.DOMAIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: api
            build-args: ""
          - name: website
            context: website
            build-args: |
              API_URL=https://api.${{ vars.DOMAIN }}
              SITE_URL=https://www.${{ vars.DOMAIN }}
          - name: backoffice
            context: backoffice
            build-args: |
              VITE_API_URL=https://api.${{ vars.DOMAIN }}
          - name: backup
            context: deploy/backup
            build-args: ""
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      APP_DIR: /opt/company-platform
    steps:
      - uses: actions/checkout@v5
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Copy the stack files
        # .env and the backups on the server are never touched.
        run: |
          # shellcheck disable=SC2029 # APP_DIR is meant to expand here, on the runner
          tar -C deploy -czf - compose.prod.yaml caddy deploy.sh | ssh target "tar -xzf - -C $APP_DIR && chmod +x $APP_DIR/deploy.sh"
      - name: Deploy ${{ github.sha }}
        run: |
          # shellcheck disable=SC2029 # APP_DIR is meant to expand here, on the runner
          ssh target "docker login ghcr.io -u ${{ github.actor }} --password-stdin" <<< "${{ secrets.GITHUB_TOKEN }}"
          # shellcheck disable=SC2029
          ssh target "$APP_DIR/deploy.sh ${{ github.sha }}"
      - name: Log out of the registry
        if: always()
        run: ssh target "docker logout ghcr.io" || true
