# Production stack. On the server it lives in /opt/company-platform next to .env
# (secrets, never in Git) and tag.env (the deployed image tag, written by deploy.sh).
# Run it through deploy.sh, not by hand: ./deploy.sh compose ps
name: company-platform

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first start the image runs a temporary socket-only server first.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *restart
    image: ${REGISTRY:?set in .env}/api:${TAG:?set by deploy.sh}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGINS: https://www.${DOMAIN},https://admin.${DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  website:
    <<: *restart
    image: ${REGISTRY}/website:${TAG}
    environment:
      # Public URL: the hero image and og:image must be reachable from outside.
      API_URL: https://api.${DOMAIN}
      SITE_URL: https://www.${DOMAIN}

  backoffice:
    <<: *restart
    image: ${REGISTRY}/backoffice:${TAG}

  caddy:
    <<: *restart
    image: caddy:2.10-alpine
    depends_on: [api, website, backoffice]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    <<: *restart
    image: ${REGISTRY}/backup:${TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-30}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - uploads:/uploads

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
